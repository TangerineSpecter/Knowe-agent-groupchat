services:
  knowe:
    image: knowe-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NPM_REGISTRY: "${KNOWE_NPM_REGISTRY:-https://registry.npmjs.org}"
        NODE_IMAGE: "${KNOWE_NODE_IMAGE:-node:22-bookworm-slim}"
        PYTHON_IMAGE: "${KNOWE_PYTHON_IMAGE:-python:3.11-slim-bookworm}"
    init: true
    restart: unless-stopped
    user: "${KNOWE_UID:-1000}:${KNOWE_GID:-1000}"
    ports:
      - "${KNOWE_BIND_HOST:-127.0.0.1}:${KNOWE_PORT:-18090}:8090"
    environment:
      KNOWE_WEB_PASSWORD_FILE: /run/secrets/web_password
      KNOWE_WEB_ORIGIN: "${KNOWE_WEB_ORIGIN:-}"
      KNOWE_WEB_SECURE_COOKIE: "${KNOWE_WEB_SECURE_COOKIE:-0}"
      TZ: "${TZ:-Asia/Shanghai}"
    secrets:
      - web_password
    volumes:
      - "${KNOWE_DATA_PATH:-./deploy/data}:/data"
      - "${KNOWE_WORKSPACE_PATH:-./deploy/workspaces}:/workspace"
    shm_size: 1gb
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  web_password:
    file: "${KNOWE_PASSWORD_PATH:-./deploy/web-password}"
